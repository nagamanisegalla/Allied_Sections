<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p,span{
            border: 2px solid black;
        }
        p{
            display: inline-block;
            height: 50px;
            width: 50px;



        }
        span{
            display: none;
            height: 50px;
            width: 50px;
        }
        
    </style>
</head>
<body>
    <p>This is block level element</p>
    <br>
    <span>This is inline element</span>
</body>
</html>
