<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul{
            display: grid;
            grid-template-rows: repeat(2,1fr);
            grid-template-columns: repeat(2,1fr);
           
        }
        li{
            border: 2px solid black;     
        }
        #child1{
            grid-row:1/2 ;
            grid-column: 1/2;
        }
        #child2{
            grid-row: 1/2;
            grid-column: 2/3;
        }
        #child3{
            grid-row:2/3;
            grid-column: 1/3;
        }
 
    </style>
</head>
<body>
    <ul type="none">
        <li id="child1">1</li>
        <li id="child2">2</li>
        <li id="child3">3</li>
     
    </ul>
</body>
</html>
