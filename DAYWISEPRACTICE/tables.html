<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,tr,td,th{
            border:2px solid black; 
            border-collapse: collapse;
        }
        td{
            text-align: center;
        }
        table{
            height:100px;
            width: 100px;
        }
        td{
            padding: 30px;
        }
    </style>
</head>
<body>
    <table>
        <caption>Student Information</caption>
        <tr>
            <th colspan="2">Name</th>
        
            <th>Skill</th>
        </tr>
        <tr>
            <td>Mounika</td>
            <td>21</td>
            <td rowspan="2">FSD</td>
        </tr>
        <tr>
            <td>Santosh</td>
            <td>47</td>
           
        </tr>
    </table>
</body>
</html>
