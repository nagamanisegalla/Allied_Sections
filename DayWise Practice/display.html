<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p,span{
            border: 2px solid black;
        }
        p{
            display: none;
            height: 70px;
            width: 50px;
        }
        span{
            display: block;
            height: 70px;
            width: 60px;
        }

    </style>
</head>
<body>
    <p>It is block level element</p>
    <br><br>
    <span>it is inline element</span>
</body>
</html>
