<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        li{
            border: 2px solid black;
            list-style-type: none;
        }
        ul{
            display: grid;
            grid-template-rows: repeat(4,1fr);
            grid-template-columns: repeat(5,1fr);
        }
        #child1{
            grid-row: 1/2;
            grid-column: 1/2;
        }
        #child2{
            grid-row: 1/2;
            grid-column: 2/3;
        }
        #child3{
            grid-row: 1/2;
            grid-column: 3/4;
        }
        #child4{
            grid-row: 1/2;
            grid-column: 4/6;
        }
        #child5{
            grid-row: 2/3;
            grid-column: 1/3;
        }
        #child6{
            grid-row: 2/3;
            grid-column: 3/4;
        }
        #child7{
            grid-row: 2/3;
            grid-column: 4/6;
        }
        #child8{
            grid-row: 3/4;
            grid-column: 1/2;
        }
        #child9{
            grid-row: 3/4;
            grid-column: 2/3;
        }
        #child10{
            grid-row: 3/4;
            grid-column: 3/4;
        }
        #child11{
            grid-row: 3/4;
            grid-column: 4/5;
        }
        #child12{
            grid-row: 3/4;
            grid-column: 5/6;
        }
        #child13{
            grid-row: 4/5;
            grid-column: 1/3;
        }
        #child14{
            grid-row: 4/5;
            grid-column: 3/6;
        }
    </style>
</head>
<body>
    <ul>
        <li id="child1">1</li>
        <li id="child2">2</li>
        <li id="child3">3</li>
        <li id="child4">4</li>
        <li id="child5">5</li>
        <li id="child6">6</li>
        <li id="child7">7</li>
        <li id="child8">8</li>
        <li id="child9">9</li>
        <li id="child10">10</li>
        <li id="child11">11</li>
        <li id="child12">12</li>
        <li id="child13">13</li>
        <li id="child14">14</li>
   
    </ul>
</body>
</html>
