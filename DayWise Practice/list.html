<!DOCTYPE html>
<html>
    <head>
        <title>List</title>
        <style>
            ul{
                list-style-type: square;
               
              
            }
        </style>
    </head>
    <body>
        <ul>
            <li>Charitha</li>
            <li>Yogi</li>
            <li>Mohan</li>
            <li>Teja</li>

        <ol type="1">
            <li>Charitha</li>
            <li>Yogi</li>
            <li>Mohan</li>
            <li>Teja</li>
        </ol>
    </body>
</html>
