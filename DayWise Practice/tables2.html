<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,th,td{
            border: 2px solid black;
            border-collapse: collapse;
            padding: 20px;
            margin: 20px;
        }

    </style>
</head>
<body>
    <table>
        <tr>
            <th>name</th>
            <th>roll</th>
            <th>class</th>
        </tr>
        <tr>
            <td rowspan="2">naga</td>
            <td>01</td>
            <td>abc</td>
        </tr>
        <tr>
          
            <td colspan="2">01</td>
            <td>abc</td>
        </tr>
        <tr>
            <td>naga</td>
            <td>abc</td>
        </tr>
    </table>
</body>
</html>
