<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Datatypes</h1>
    <script>
        let a = 10
        console.log(a)
        console.log(typeof(a))
        let b = 20.5
        console.log(b)
        console.log(typeof(b))
        let nick = 'mani'
        console.log(nick)
        console.log(typeof(nick))
        let isvalid = false
        console.log(isvalid)
        console.log(typeof(isvalid))
        let z;
        console.log(z)
        console.log(typeof(z))
        let y = null
        console.log(y)
        console.log(typeof(y))
        console.log(typeof [])
        console.log(typeof {})
        console.log(typeof function(){})

        console.log("5" + 1)
        console.log("5" - 1)
        console.log(true - 1)
        let x = "10"
        console.log(typeof(x))
        x = Number(x)
        console.log(typeof(x))
        console.log(Boolean("hi"))
        let num = "12a34.345a"
        /*num = Number(num)
        console.log(typeof(num))
        console.log(num)*/
        /*num = parseInt(num)
        console.log(typeof(num))
        console.log(num)*/
        num = parseFloat(num)
        console.log(typeof(num))
        console.log(num)
    </script>
</body>
</html>
