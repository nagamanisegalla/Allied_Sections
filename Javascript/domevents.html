<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 >DOM Events</h1>
    <form >
        <label for="">Name</label>
        <input type="text" id="new">
        <input type="submit">
    </form>
    <script>
        let head = document.getElementById("new")
        head.addEventListener("focus",function(){
            head.style.backgroundColor= "yellow" 
        })
            head.addEventListener("blur",function(){
            head.style.backgroundColor= "pink" 
        })
    </script>
</body>
</html>
