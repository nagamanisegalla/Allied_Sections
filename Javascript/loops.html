<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for(let i = 1; i<5; i++){
            console.log(i+1)
            document.writeln("hello")
        }
        console.log("WHILE LOOP")
        let j = 1
        while(j<=6){
            console.log(j)
            j++
        }

        console.log("do while loop")
        let k = 1
        do{
            console.log(k)
            k++
        }while(k<=4)
        console.log("jump statements")
        for(let q=1; q<=6; q++){
            if(q==4){
                continue
            }
            console.log(q)
        }
    </script>
</body>
</html>
