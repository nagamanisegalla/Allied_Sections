<!DOCTYPE html>
<html>
<head>
    <title>User Eligibility Checker</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }

        .box {
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0px 0px 10px gray;
        }

        button {
            padding: 10px 20px;
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: darkgreen;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Course Eligibility Checker</h2>
    <button onclick="checker()">Start</button>
</div>

<script>
    function checker() {
    var name = prompt("Enter your name");
    if (name == "" || name == null) {
        alert("Name is required");
    } else {
        var age = prompt("Enter your age");
        if (age >= 18) {
            alert(name + " you are Eligible");
            var course = prompt("Enter course: HTML / CSS / JavaScript");
            switch (course) {
                case "HTML":
                    alert("Course Fee: ₹3000");
                    break;
                case "CSS":
                    alert("Course Fee: ₹4000");
                    break;
                case "JavaScript":
                    alert("Course Fee: ₹5000");
                    break;
                default:
                    alert("Invalid course selected");
            }
        } else {
            alert(name + " you are Not Eligible");
        }
    }
}
</script>
</body>
</html>
