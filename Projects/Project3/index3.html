<!DOCTYPE html>
<html>
<head>
    <title>Job Eligibility Checker</title>
</head>
<body>

<button onclick="job()">Check Job Eligibility</button>

<script>
function job() {

    var name = prompt("Enter your name");

    if (name == "" || name == null) {
        alert("Name is required");
    } else {

        var age = Number(prompt("Enter your age"));

        if (age >= 21) {

            var qualification = prompt("Enter qualification: Degree / Diploma / Intermediate");

            switch (qualification) {
                case "Degree":
                    alert(name + " is Eligible for Software Job");
                    break;

                case "Diploma":
                    alert(name + " is Eligible for Technical Job");
                    break;

                case "Intermediate":
                    alert(name + " is Not Eligible for Job");
                    break;

                default:
                    alert("Invalid qualification");
            }

        } else {
            alert(name + " is Not Eligible due to age");
        }
    }
}
</script>

</body>
</html>
